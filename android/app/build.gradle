plugins {
  id 'com.android.application'
}

android {
  namespace 'com.kalima.learning'
  compileSdk 35

  defaultConfig {
    applicationId 'com.kalima.learning'
    minSdk 26
    targetSdk 34
    versionCode 12
    versionName '0.12.0-offline-test'
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  buildTypes {
    debug {
      debuggable true
    }
  }
}

// Copy the complete existing curriculum into the installable APK.
def kalimaAssetsDir = file("$buildDir/generated/kalima-assets")
def bundleKalimaContent = tasks.register('bundleKalimaContent', Copy) {
  from file("../../dist")
  into file("$kalimaAssetsDir/kalima")
  exclude '**/.DS_Store'
}
android.sourceSets.main.assets.srcDir(kalimaAssetsDir)
tasks.matching { it.name.startsWith('merge') && it.name.endsWith('Assets') }.configureEach {
  dependsOn(bundleKalimaContent)
}
