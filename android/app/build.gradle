plugins {
  id 'com.android.application'
}

android {
  namespace 'com.kalima.learning'
  compileSdk 35

  defaultConfig {
    applicationId 'com.kalima.learning'
    minSdk 26
    targetSdk 34
    versionCode 2
    versionName '0.2.0-test'
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  buildTypes {
    debug {
      debuggable true
    }
  }
}
