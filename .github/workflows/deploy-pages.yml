name: Publish Kalima to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "dist/**"
      - "tests/example-quality.test.cjs"
      - "tests/example-coverage.test.cjs"
      - "tests/topics.test.cjs"
      - "tests/topics-multilingual.test.cjs"
      - "tests/daily-reminders.test.cjs"
      - "tests/browser-audio.test.cjs"
      - "tests/example-audio-icon.test.cjs"
      - "tests/review-mistakes.test.cjs"
      - "tests/safari-startup.test.cjs"
      - "tests/rank-celebration.test.cjs"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify vocabulary example relevance
        run: node tests/example-quality.test.cjs

      - name: Check example coverage across all 12 learning directions
        run: node tests/example-coverage.test.cjs

      - name: Verify rank promotion celebration and original fanfare
        run: node tests/rank-celebration.test.cjs

      - name: Verify Safari startup with stale cache or stalled account
        run: node tests/safari-startup.test.cjs

      - name: Verify missed-word reviews
        run: node tests/review-mistakes.test.cjs

      - name: Verify example audio icon
        run: node tests/example-audio-icon.test.cjs

      - name: Verify Safari and browser speech user gestures
        run: node tests/browser-audio.test.cjs

      - name: Verify Android daily reminder integration
        run: node tests/daily-reminders.test.cjs

      - name: Verify practical vocabulary section navigation and audio
        run: node tests/topics.test.cjs

      - name: Verify all 12 language directions in expanded topic sections
        run: node tests/topics-multilingual.test.cjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the static Kalima website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the site
        id: deployment
        uses: actions/deploy-pages@v4
