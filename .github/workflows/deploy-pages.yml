name: Publish Kalima to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "dist/**"
      - "tests/example-quality.test.cjs"
      - "tests/example-coverage.test.cjs"
      - "tests/topics.test.cjs"
      - "tests/topics-multilingual.test.cjs"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify vocabulary example relevance
        run: node tests/example-quality.test.cjs

      - name: Check example coverage across all 12 learning directions
        run: node tests/example-coverage.test.cjs

      - name: Verify practical vocabulary section navigation and audio
        run: node tests/topics.test.cjs

      - name: Verify all 12 language directions in expanded topic sections
        run: node tests/topics-multilingual.test.cjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the static Kalima website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the site
        id: deployment
        uses: actions/deploy-pages@v4
