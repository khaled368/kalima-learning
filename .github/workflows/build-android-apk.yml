name: Build Kalima Android test APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kalima-android-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android build tools
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Python for launcher icon
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare launcher icon from Kalima's original logo
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.2.1
          python android/prepare_icons.py
          test -s android/app/src/main/res/drawable-nodpi/ic_kalima_logo_foreground.png

      - name: Build debug-signed APK
        run: gradle -p android --no-daemon --stacktrace assembleDebug

      - name: Name APK for installation
        run: |
          mkdir -p apks
          cp android/app/build/outputs/apk/debug/app-debug.apk apks/Kalima-Android-Test.apk
          test -s apks/Kalima-Android-Test.apk
          sha256sum apks/Kalima-Android-Test.apk

      - name: Save downloadable workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kalima-Android-Test-APK
          path: apks/Kalima-Android-Test.apk
          retention-days: 30

      - name: Publish test APK as GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: android-preview-v5
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" apks/Kalima-Android-Test.apk --clobber
          else
            gh release create "$TAG" apks/Kalima-Android-Test.apk --target "$GITHUB_SHA" --title "Kalima Android - Test APK v0.5" --notes "Android v0.5: official Kalima book logo is now the Android home-screen app icon. Includes v0.4 speech repairs. Internet required. Sync progress before uninstalling older debug APK." --prerelease
          fi
