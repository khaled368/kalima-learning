name: Build Kalima Android test APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "dist/**"
      - "tests/rank-evolution.test.cjs"
      - "tests/rank-celebration.test.cjs"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kalima-android-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android build tools
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Python for launcher icon
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare launcher icon from Kalima's original logo
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.2.1
          python android/prepare_icons.py
          test -s android/app/src/main/res/drawable-nodpi/ic_kalima_logo_foreground.png

      - name: Verify rank promotion celebration and original fanfare
        run: node tests/rank-celebration.test.cjs

      - name: Verify old-shield tearing and stable new-shield reveal
        run: node tests/rank-evolution.test.cjs

      - name: Verify missed-word reviews
        run: node tests/review-mistakes.test.cjs

      - name: Verify example audio icon
        run: node tests/example-audio-icon.test.cjs

      - name: Verify browser speech inside the packaged app
        run: node tests/browser-audio.test.cjs

      - name: Verify native daily reminder integration
        run: node tests/daily-reminders.test.cjs

      - name: Build debug-signed APK
        run: gradle -p android --no-daemon --stacktrace assembleDebug

      - name: Verify embedded lesson assets
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          unzip -Z1 "$APK" > /tmp/kalima-apk-entries.txt
          grep -Fxq 'assets/kalima/index.html' /tmp/kalima-apk-entries.txt
          grep -Fxq 'assets/kalima/data/manifest.json' /tmp/kalima-apk-entries.txt
          grep -Fxq 'assets/kalima/topics.js' /tmp/kalima-apk-entries.txt
          unzip -p "$APK" assets/kalima/index.html > /tmp/kalima-index.html
          grep -q 'app-bootstrap.js' /tmp/kalima-index.html
          echo "PASS: Complete Kalima lessons are packaged offline"

      - name: Name APK for installation
        run: |
          mkdir -p apks
          cp android/app/build/outputs/apk/debug/app-debug.apk apks/Kalima-Android-Test.apk
          test -s apks/Kalima-Android-Test.apk
          sha256sum apks/Kalima-Android-Test.apk

      - name: Save downloadable workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kalima-Android-Test-APK
          path: apks/Kalima-Android-Test.apk
          retention-days: 30

      - name: Publish test APK as GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: android-preview-v15
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" apks/Kalima-Android-Test.apk --clobber
          else
            gh release create "$TAG" apks/Kalima-Android-Test.apk --target "$GITHUB_SHA" --title "Kalima Android - Offline Test APK v0.15" --notes "Android v0.15: the previous original shield tears into eight pieces only when the progress bar reaches 100%; the new original shield emerges from inside with a golden flare, then rests without bass pulsing. The first rank begins from a neutral starter emblem. Android haptics, offline vocabulary, reviews and reminders are preserved. Sync progress before replacing an older debug APK." --prerelease
          fi
