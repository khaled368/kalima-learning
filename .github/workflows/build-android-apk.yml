name: Build Kalima Android test APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kalima-android-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android build tools
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug-signed APK
        run: gradle -p android --no-daemon --stacktrace assembleDebug

      - name: Name APK for installation
        run: |
          mkdir -p apks
          cp android/app/build/outputs/apk/debug/app-debug.apk apks/Kalima-Android-Test.apk
          test -s apks/Kalima-Android-Test.apk
          sha256sum apks/Kalima-Android-Test.apk

      - name: Save downloadable workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kalima-Android-Test-APK
          path: apks/Kalima-Android-Test.apk
          retention-days: 30

      - name: Publish test APK as GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: android-preview-v1
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" apks/Kalima-Android-Test.apk --clobber
          else
            gh release create "$TAG" apks/Kalima-Android-Test.apk --target "$GITHUB_SHA" --title "Kalima Android - Test APK v0.1" --notes "Experimental installable Android wrapper for Kalima. Requires internet. Sign in with the same Kalima account. For testing only." --prerelease
          fi
